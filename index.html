<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Rafaini - Sistema</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #e91e63, #ff5fa2);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            background: #fff;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 420px;
            width: 95%;
            animation: fadeIn 0.6s ease;
        }

        h1 {
            color: #e91e63;
            font-weight: 600;
            margin-bottom: 10px;
        }

        p {
            color: #666;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        label {
            font-size: 13px;
            color: #555;
            margin-bottom: 5px;
            display: block;
        }

        input {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #ddd;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: #e91e63;
            box-shadow: 0 0 0 2px rgba(233,30,99,0.2);
        }

        button {
            width: 100%;
            margin-top: 15px;
            background: linear-gradient(135deg, #e91e63, #ff5fa2);
            border: none;
            color: white;
            padding: 14px;
            font-size: 16px;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.3s ease;
            box-shadow: 0 10px 20px rgba(233,30,99,0.4);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px rgba(233,30,99,0.5);
        }

        .mensagem {
            margin-top: 15px;
            font-size: 14px;
            font-weight: 500;
            display: none;
        }

        .sucesso {
            color: #2e7d32;
        }

        .erro {
            color: #c62828;
        }

        .footer {
            margin-top: 25px;
            font-size: 12px;
            color: #999;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>🚀 Sistema Rafaini</h1>
        <p>Preencha seus dados para acessar o sistema</p>

        <form id="formCadastro">
            <div class="input-group">
                <label>Nome</label>
                <input type="text" id="nome" required>
            </div>

            <div class="input-group">
                <label>Email</label>
                <input type="email" id="email" required>
            </div>

            <div class="input-group">
                <label>Contato</label>
                <input type="tel" id="telefone" required>
            </div>

            <button type="submit">Entrar no sistema</button>
        </form>

        <div id="mensagem" class="mensagem"></div>

        <div class="footer">
            © 2026 Rafaini • A essência da beleza
        </div>
    </div>

<script>
document.getElementById("formCadastro").addEventListener("submit", async function(e) {
    e.preventDefault();

    const mensagem = document.getElementById("mensagem");
    mensagem.style.display = "none";

    const dados = {
        nome: document.getElementById("nome").value,
        email: document.getElementById("email").value,
        telefone: document.getElementById("telefone").value
    };

    try {
        const response = await fetch("/usuarios", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(dados)
        });

        const resultado = await response.json();

        mensagem.textContent = resultado.mensagem;
        mensagem.className = "mensagem sucesso";
        mensagem.style.display = "block";

        document.getElementById("formCadastro").reset();

    } catch (error) {
        mensagem.textContent = "Erro ao enviar dados. Tente novamente.";
        mensagem.className = "mensagem erro";
        mensagem.style.display = "block";
    }
});
</script>

</body>
</html>
